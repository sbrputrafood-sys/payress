<!DOCTYPE html>
<html lang="id" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Catatan Harian - SBR Putra Food</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        input, select { transition: all 0.2s ease-in-out; }
        input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
        .dark .custom-scroll::-webkit-scrollbar-thumb { background-color: #475569; }
    </style>
</head>
<body class="min-h-screen bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 pb-16 transition-colors duration-300">

    <!-- Toast Container -->
    <div id="toastContainer" class="fixed bottom-4 left-4 right-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>

    <!-- Mobile Header -->
    <nav class="bg-white dark:bg-slate-800 border-b border-gray-200 dark:border-slate-700 sticky top-0 z-30 px-4 py-3 shadow-sm">
        <div class="flex justify-between items-center max-w-md mx-auto">
            <div class="flex items-center space-x-2.5">
                <img src="https://raw.githubusercontent.com/sbrputrafood-sys/payress/677036e078cc7fa6c94788da8482dc53d883e2df/sbr_logo.png" alt="SBR Logo" class="w-7 h-7 object-contain rounded-md border border-gray-100 dark:border-slate-700 bg-white">
                <div>
                    <h1 class="font-bold text-xs leading-tight text-gray-900 dark:text-slate-100">Catatan Harian</h1>
                    <p class="text-[9px] text-gray-500 dark:text-slate-400 font-medium">SBR Putra Food</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Theme Toggle Button -->
                <button onclick="toggleTheme()" class="p-2 rounded-xl bg-gray-100 dark:bg-slate-700 text-gray-600 dark:text-slate-300 hover:bg-gray-200 dark:hover:bg-slate-600 transition" title="Ganti Tema">
                    <i data-feather="moon" id="iconMoon" class="w-4 h-4"></i>
                    <i data-feather="sun" id="iconSun" class="w-4 h-4 hidden"></i>
                </button>
                <!-- Connection Status -->
                <div class="flex items-center space-x-1 bg-yellow-50 dark:bg-yellow-900/30 px-2 py-1 rounded-full border border-yellow-100 dark:border-yellow-800/50" id="status-connection">
                    <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span></span>
                    <span id="text-connection" class="text-[9px] font-semibold text-yellow-700 dark:text-yellow-500">Loading</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Container (Mobile Optimized) -->
    <main class="max-w-md mx-auto px-3 pt-4 space-y-4">
        
        <!-- CARD 1: FORM INPUT HARIAN -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-slate-700">
            <h2 class="text-xs font-bold text-gray-800 dark:text-slate-100 mb-3 flex items-center">
                <i data-feather="edit-3" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i> Input Catatan Harian
            </h2>
            
            <div class="grid grid-cols-2 gap-2.5 mb-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 mb-1">Tanggal</label>
                    <input type="date" id="inputTglHarian" class="w-full text-xs p-2 rounded-xl border border-gray-300 dark:border-slate-600 bg-gray-50 dark:bg-slate-700 dark:text-white outline-none focus:border-blue-500">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 mb-1">Agen / Reseller</label>
                    <select id="inputResellerHarian" class="w-full text-xs p-2 rounded-xl border border-gray-300 dark:border-slate-600 bg-gray-50 dark:bg-slate-700 dark:text-white outline-none focus:border-blue-500">
                        <option value="">Pilih...</option>
                    </select>
                </div>
            </div>

            <!-- Tambahan Kolom Input By dan Fokus Input -->
            <div class="grid grid-cols-2 gap-2.5 mb-3">
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 mb-1">Input By ?</label>
                    <select id="inputByPegawai" class="w-full text-xs p-2 rounded-xl border border-gray-300 dark:border-slate-600 bg-gray-50 dark:bg-slate-700 dark:text-white outline-none focus:border-blue-500">
                        <option value="">Pilih Nama...</option>
                        <option value="Fatah">Fatah</option>
                        <option value="Rio">Rio</option>
                        <option value="Admin">Admin</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-gray-500 dark:text-slate-400 mb-1">Fokus Tipe Input</label>
                    <select id="inputTipeHarian" onchange="updateOpsiHarian()" class="w-full text-xs p-2 rounded-xl border border-gray-300 dark:border-slate-600 bg-blue-50 dark:bg-slate-900 text-blue-700 dark:text-blue-400 font-semibold outline-none focus:border-blue-500">
                        <option value="semua">Tampilkan Semua</option>
                        <option value="jadi">📦 Barang Jadi (Setoran)</option>
                        <option value="bahan">🛍️ Bahan Baku (Ambil)</option>
                    </select>
                </div>
            </div>

            <!-- Container Baris Multi Input -->
            <div class="space-y-2 mb-3 max-h-[50vh] overflow-y-auto custom-scroll pr-1" id="containerHarianRows">
                <!-- Baris ditambahkan via JS -->
            </div>

            <!-- Action Buttons Form -->
            <div class="flex gap-2 pt-2 border-t border-gray-100 dark:border-slate-700">
                <button onclick="addRowHarian()" class="bg-blue-50 dark:bg-slate-700 hover:bg-blue-100 text-blue-600 dark:text-blue-300 text-xs font-bold px-3 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center border border-blue-200 dark:border-slate-600">
                    <i data-feather="plus" class="w-3.5 h-3.5 mr-1"></i> Baris
                </button>
                <button id="btnSimpanHarian" onclick="simpanCatatanHarian()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2.5 rounded-xl shadow-sm transition flex items-center justify-center">
                    <i data-feather="save" class="w-3.5 h-3.5 mr-1.5"></i> Simpan Catatan
                </button>
            </div>
        </div>

        <!-- CARD 2: DAFTAR DRAFT TERSIMPAN -->
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-gray-200 dark:border-slate-700">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-gray-800 dark:text-slate-100 flex items-center">
                    <i data-feather="archive" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i> Daftar Draft Tersimpan
                </h3>
                <button onclick="fetchListHarian()" class="text-blue-500 hover:text-blue-600 text-[11px] font-bold flex items-center gap-1">
                    <i data-feather="refresh-cw" class="w-3 h-3"></i> Segarkan
                </button>
            </div>
            
            <div class="bg-gray-50 dark:bg-slate-900/50 p-2.5 rounded-xl border border-gray-100 dark:border-slate-700 space-y-2 mb-3">
                <div class="flex gap-2">
                    <input type="date" id="filterTglAwal" class="w-1/2 text-[10px] p-1.5 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none focus:border-blue-400" onchange="renderFilteredDrafts()">
                    <input type="date" id="filterTglAkhir" class="w-1/2 text-[10px] p-1.5 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none focus:border-blue-400" onchange="renderFilteredDrafts()">
                </div>
                <select id="filterDraftAgen" class="w-full text-[10px] p-1.5 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-800 outline-none focus:border-blue-400" onchange="renderFilteredDrafts()">
                    <option value="">Semua Agen</option>
                </select>
            </div>

            <!-- List Draft -->
            <div class="max-h-[320px] overflow-y-auto custom-scroll pr-1 space-y-2" id="listCatatanHarian">
                <div class="flex justify-center py-6"><i data-feather="loader" class="w-5 h-5 animate-spin text-blue-500"></i></div>
            </div>
        </div>

    </main>

    <!-- MODAL POST SAVE (CETAK BLUETOOTH) -->
    <div id="modalPostSave" class="fixed inset-0 z-[120] flex items-center justify-center hidden p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-slate-800 w-full max-w-xs rounded-2xl shadow-2xl flex flex-col p-5 text-center">
            <div class="w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-3">
                <i data-feather="check-circle" class="w-6 h-6"></i>
            </div>
            <h3 class="text-sm font-bold text-gray-800 dark:text-slate-100 mb-1">Catatan Tersimpan!</h3>
            <p class="text-[11px] text-gray-500 dark:text-slate-400 mb-4">Ingin mencetak nota ini langsung ke printer bluetooth thermal 58mm?</p>
            <div class="flex flex-col gap-2">
                <button onclick="cetakDraftTerakhir()" class="bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold py-2.5 rounded-xl shadow-sm flex items-center justify-center gap-1.5">
                    <i data-feather="printer" class="w-4 h-4"></i> Cetak via Bluetooth
                </button>
                <button onclick="closeFormModal('modalPostSave')" class="bg-gray-100 dark:bg-slate-700 text-gray-700 dark:text-slate-300 text-xs font-bold py-2 rounded-xl">
                    Tutup / Lewati
                </button>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL DRAFT TERSIMPAN -->
    <div id="modalDetailDraft" class="fixed inset-0 z-50 flex items-center justify-center hidden p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-slate-800 w-full max-w-sm rounded-2xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden">
            <div class="flex justify-between items-center p-4 border-b border-gray-100 dark:border-slate-700">
                <h3 class="text-xs font-bold text-gray-800 dark:text-slate-100 flex items-center">
                    <i data-feather="list" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i> Rincian Draft Tersimpan
                </h3>
                <button onclick="closeFormModal('modalDetailDraft')" class="text-gray-400 hover:text-gray-600 p-1 bg-gray-50 dark:bg-slate-700 rounded-lg"><i data-feather="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-4 overflow-y-auto custom-scroll space-y-3 flex-1">
                <div id="headerDetailDraft" class="mb-2 border-b border-gray-100 dark:border-slate-700 pb-2"></div>
                <ul id="listDetailDraft" class="space-y-2"></ul>
            </div>
        </div>
    </div>

    <!-- MODAL PIN KEAMANAN -->
    <div id="modalPin" class="fixed inset-0 z-[100] flex items-center justify-center hidden p-4 bg-gray-900/60 backdrop-blur-sm transition-opacity">
        <div class="bg-white dark:bg-slate-800 w-full max-w-xs rounded-2xl shadow-2xl flex flex-col p-4">
            <div class="flex justify-between items-center mb-3">
                <h3 class="text-xs font-bold text-gray-800 dark:text-slate-100 flex items-center"><i data-feather="lock" class="w-3.5 h-3.5 mr-1.5 text-blue-500"></i> Verifikasi PIN</h3>
                <button onclick="closeFormModal('modalPin')" class="text-gray-400 hover:text-gray-600 p-1 bg-gray-50 dark:bg-slate-700 rounded-lg"><i data-feather="x" class="w-4 h-4"></i></button>
            </div>
            <p class="text-[10px] text-gray-500 dark:text-slate-400 mb-3">Masukkan PIN untuk menghapus rincian draft ini.</p>
            <input type="password" id="inputPinHapus" placeholder="•••" class="w-full text-center tracking-widest text-base font-bold p-2.5 rounded-xl border border-gray-300 dark:border-slate-600 bg-gray-50 dark:bg-slate-900 dark:text-white outline-none focus:border-blue-500 mb-3">
            <div class="flex gap-2">
                <button onclick="closeFormModal('modalPin')" class="bg-gray-100 dark:bg-slate-700 text-gray-700 text-xs font-bold px-3 py-2 rounded-xl flex-1">Batal</button>
                <button onclick="prosesHapusCatatanHarian()" class="bg-red-500 hover:bg-red-400 text-white text-xs font-bold px-3 py-2 rounded-xl flex-1 shadow-sm">Hapus</button>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA -->
    <script>
        feather.replace();

        function toggleTheme() {
            const htmlEl = document.documentElement;
            htmlEl.classList.toggle('dark');
            const isDark = htmlEl.classList.contains('dark');
            if (isDark) {
                document.getElementById('iconMoon').classList.add('hidden');
                document.getElementById('iconSun').classList.remove('hidden');
            } else {
                document.getElementById('iconMoon').classList.remove('hidden');
                document.getElementById('iconSun').classList.add('hidden');
            }
        }

        function formatTanggalID(dateStr) {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            const day = String(d.getDate()).padStart(2, '0');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            return `${day}/${months[d.getMonth()]}/${String(d.getFullYear()).slice(-2)}`;
        }

        function formatHariTanggalID(dateStr) {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            const listHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const namaHari = listHari[d.getDay()];
            const day = String(d.getDate()).padStart(2, '0');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            return `${namaHari}, ${day}/${months[d.getMonth()]}/${String(d.getFullYear()).slice(-2)}`;
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            const icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-octagon' : 'info');
            
            toast.className = `${colorClass} text-white px-3.5 py-2.5 rounded-xl shadow-xl transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2 text-xs font-bold tracking-wide pointer-events-auto`;
            toast.innerHTML = `<i data-feather="${icon}" class="w-4 h-4 shrink-0"></i> <span>${message}</span>`;
            container.appendChild(toast); feather.replace();
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        const supabaseUrl = 'https://uocvuddqhviorebinpva.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvY3Z1ZGRxaHZpb3JlYmlucHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTQ0NDAsImV4cCI6MjEwMTI3MDQ0MH0.mWGTOTfHG4Q62S3P4LQi-5bGviMPWgMzo2p2AECquL8';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let masterData = { resellers: [], barangJadi: [], bahanBaku: [] };
        let globalDraftData = {};
        let lastSavedGroupKey = null;

        async function loadMasterData() {
            try {
                const [resellersData, barangData] = await Promise.all([
                    supabaseClient.from('reseller').select('*'),
                    supabaseClient.from('barang').select('*')
                ]);

                if (resellersData.error) throw resellersData.error;
                if (barangData.error) throw barangData.error;

                masterData.resellers = resellersData.data.map(r => ({ id: r.id, nama: r.nama_reseller }));
                masterData.barangJadi = []; masterData.bahanBaku = [];

                barangData.data.forEach(b => {
                    if (b.tipe === 'jadi') masterData.barangJadi.push({ id: b.id, nama: b.nama_barang });
                    else masterData.bahanBaku.push({ id: b.id, nama: b.nama_barang });
                });

                const statusConn = document.getElementById('status-connection');
                statusConn.classList.replace('bg-yellow-50', 'bg-green-50');
                statusConn.classList.replace('border-yellow-100', 'border-green-100');
                if(statusConn.querySelector('.animate-ping')) statusConn.querySelector('.animate-ping').classList.replace('bg-yellow-400', 'bg-green-400');
                if(statusConn.querySelector('.relative.inline-flex')) statusConn.querySelector('.relative.inline-flex').classList.replace('bg-yellow-500', 'bg-green-500');
                
                document.getElementById('text-connection').innerText = 'Online';
                document.getElementById('text-connection').className = 'text-[9px] font-semibold text-green-700 dark:text-green-400';

                initDefaults();
            } catch (error) {
                const statusConn = document.getElementById('status-connection');
                statusConn.classList.replace('bg-yellow-50', 'bg-red-50');
                document.getElementById('text-connection').innerText = 'Offline';
                document.getElementById('text-connection').className = 'text-[9px] font-semibold text-red-700 dark:text-red-400';
                showNotification("Gagal terhubung ke Database Supabase.", "error");
            }
        }

        function initDefaults() {
            const selRes = document.getElementById('inputResellerHarian');
            selRes.innerHTML = '<option value="">Pilih...</option>';
            masterData.resellers.forEach(r => selRes.innerHTML += `<option value="${r.id}">${r.nama}</option>`);

            const tzOffset = (new Date()).getTimezoneOffset() * 60000;
            document.getElementById('inputTglHarian').value = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);

            document.getElementById('containerHarianRows').innerHTML = '';
            for(let i=0; i<5; i++) {
                addRowHarian();
            }
            fetchListHarian();
        }

        function getOptionsHarianHtml(tipeFokus = 'semua') {
            let html = '<option value="">Pilih Barang / Bahan...</option>';
            if (tipeFokus === 'semua' || tipeFokus === 'jadi') {
                html += '<optgroup label="📦 BARANG JADI">';
                masterData.barangJadi.forEach(b => html += `<option value="${b.id}">${b.nama}</option>`);
                html += '</optgroup>';
            }
            if (tipeFokus === 'semua' || tipeFokus === 'bahan') {
                html += '<optgroup label="🛍️ BAHAN BAKU">';
                masterData.bahanBaku.forEach(b => html += `<option value="${b.id}">${b.nama}</option>`);
                html += '</optgroup>';
            }
            return html;
        }

        function updateOpsiHarian() {
            const tipeFokus = document.getElementById('inputTipeHarian').value;
            const newHtml = getOptionsHarianHtml(tipeFokus);
            document.querySelectorAll('.item-harian').forEach(select => {
                const currentVal = select.value;
                select.innerHTML = newHtml;
                const exists = Array.from(select.options).some(opt => opt.value === currentVal);
                if(exists) select.value = currentVal;
            });
        }

        function addRowHarian() {
            const container = document.getElementById('containerHarianRows');
            const tipeFokus = document.getElementById('inputTipeHarian')?.value || 'semua';
            const div = document.createElement('div');
            div.className = 'row-input-harian mb-1.5 flex flex-col gap-1 bg-gray-50 dark:bg-slate-700/50 p-1.5 rounded-xl border border-gray-200 dark:border-slate-600';
            div.innerHTML = `
                <div class="flex gap-2 items-center">
                    <div class="w-7/12">
                        <select class="item-harian w-full text-xs p-2 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 dark:text-white outline-none focus:border-blue-500">
                            ${getOptionsHarianHtml(tipeFokus)}
                        </select>
                    </div>
                    <div class="w-3/12">
                        <input type="number" placeholder="Qty" min="1" class="qty-harian w-full text-xs p-2 rounded-lg border border-gray-300 dark:border-slate-600 bg-white dark:bg-slate-700 dark:text-white outline-none focus:border-blue-500 text-center">
                    </div>
                    <div class="w-2/12 flex justify-end gap-1">
                        <button type="button" onclick="this.closest('.row-input-harian').querySelector('.keterangan-container').classList.toggle('hidden')" class="text-blue-400 hover:text-blue-600 p-1.5 bg-blue-50 dark:bg-blue-900/30 rounded-lg transition" title="Catatan"><i data-feather="edit-2" class="w-3.5 h-3.5"></i></button>
                        <button type="button" onclick="this.closest('.row-input-harian').remove()" class="text-red-400 hover:text-red-600 p-1.5 bg-red-50 dark:bg-red-900/30 rounded-lg transition" title="Hapus"><i data-feather="x" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>
                <div class="keterangan-container hidden w-full">
                    <input type="text" placeholder="Tulis catatan / keterangan..." class="keterangan-input w-full text-[10px] p-2 rounded-lg border border-gray-200 dark:border-slate-500 bg-white dark:bg-slate-800 outline-none focus:border-blue-400 mt-1">
                </div>
            `;
            container.appendChild(div);
            feather.replace();
        }

        async function fetchListHarian() {
            const container = document.getElementById('listCatatanHarian');
            container.innerHTML = `<div class="flex justify-center py-4"><i data-feather="loader" class="w-5 h-5 animate-spin text-blue-500"></i></div>`;
            feather.replace();
            try {
                const { data, error } = await supabaseClient.from('buku_harian').select('*').eq('is_paid', false).order('tanggal_setor', { ascending: false });
                if(error) throw error;
                
                globalDraftData = {};
                if(data && data.length > 0) {
                    data.forEach(d => {
                        let key = `${d.tanggal_setor}_${d.reseller_id}`;
                        if(!globalDraftData[key]) {
                            globalDraftData[key] = { tgl: d.tanggal_setor, reseller_id: d.reseller_id, input_by: d.input_by, items: [] };
                        }
                        globalDraftData[key].items.push(d);
                    });
                }
                
                const selDraftAgen = document.getElementById('filterDraftAgen');
                const currVal = selDraftAgen.value;
                selDraftAgen.innerHTML = '<option value="">Semua Agen</option>';
                masterData.resellers.forEach(r => selDraftAgen.innerHTML += `<option value="${r.id}">${r.nama}</option>`);
                selDraftAgen.value = currVal; 

                renderFilteredDrafts();
            } catch (err) {
                container.innerHTML = `<div class="text-center text-red-500 text-xs py-4">Gagal memuat: ${err.message}</div>`;
            }
        }

        function renderFilteredDrafts() {
            const container = document.getElementById('listCatatanHarian');
            const filterAgen = document.getElementById('filterDraftAgen').value;
            const filterTglAwal = document.getElementById('filterTglAwal').value;
            const filterTglAkhir = document.getElementById('filterTglAkhir').value;

            if(Object.keys(globalDraftData).length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 text-xs py-6 italic">Belum ada catatan harian tersimpan.</div>';
                return;
            }

            let html = '';
            Object.keys(globalDraftData).forEach(key => {
                let group = globalDraftData[key];
                
                if (filterAgen && group.reseller_id !== filterAgen) return;
                if (filterTglAwal && group.tgl < filterTglAwal) return;
                if (filterTglAkhir && group.tgl > filterTglAkhir) return;

                let reseller = masterData.resellers.find(r => r.id === group.reseller_id);
                let rName = reseller ? reseller.nama : 'Unknown';
                let formattedDate = formatHariTanggalID(group.tgl); 
                let totalItems = group.items.length;
                let inputByName = group.input_by || '-';

                html += `
                <div class="bg-white dark:bg-slate-800 border border-gray-200 dark:border-slate-700 rounded-xl p-2.5 shadow-sm text-xs transition flex justify-between items-center group">
                    <div onclick="bukaDetailDraft('${key}')" class="flex-1 cursor-pointer flex flex-col justify-center truncate pr-2">
                        <div class="font-bold text-gray-800 dark:text-slate-200 flex items-center gap-1.5">
                            <i data-feather="user" class="w-3.5 h-3.5 text-blue-500 shrink-0"></i>
                            <span class="truncate">${rName}</span> <span class="text-gray-400 font-medium text-[10px]">(${totalItems})</span>
                        </div>
                        <div class="text-[9px] text-gray-500 dark:text-slate-400 flex items-center gap-1 mt-0.5">
                            <i data-feather="edit-2" class="w-2.5 h-2.5"></i> Disiapkan oleh: <span class="font-semibold">${inputByName}</span>
                        </div>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                        <button onclick="cetakDraftKhusus('${key}')" class="text-blue-500 bg-blue-50 dark:bg-blue-900/30 p-1.5 rounded-lg hover:bg-blue-100 transition" title="Cetak Bluetooth">
                            <i data-feather="printer" class="w-3.5 h-3.5"></i>
                        </button>
                        <button onclick="bukaDetailDraft('${key}')" class="text-pink-500 bg-pink-50 dark:bg-pink-900/30 p-1.5 rounded-lg hover:bg-pink-100 transition" title="Rincian">
                            <i data-feather="file-text" class="w-3.5 h-3.5"></i>
                        </button>
                        <span class="font-semibold text-gray-500 dark:text-slate-400 text-[10px] ml-1">${formattedDate}</span>
                    </div>
                </div>`;
            });

            container.innerHTML = html || '<div class="text-center text-gray-400 text-xs py-6 italic">Data tidak ditemukan.</div>';
            feather.replace();
        }

        function bukaDetailDraft(key) {
            const group = globalDraftData[key];
            if(!group) return;

            let reseller = masterData.resellers.find(r => r.id === group.reseller_id);
            let rName = reseller ? reseller.nama : 'Unknown';

            document.getElementById('headerDetailDraft').innerHTML = `
                <div class="flex justify-between items-start">
                    <div class="flex flex-col">
                        <span class="font-black text-gray-800 dark:text-slate-200 text-xs">${rName}</span>
                        <div class="text-[10px] text-gray-500 dark:text-slate-400 mt-1 flex items-center gap-1">
                            <i data-feather="edit-2" class="w-2.5 h-2.5"></i> Disiapkan oleh: ${group.input_by || '-'}
                        </div>
                    </div>
                    <span class="text-xs font-semibold text-gray-500 dark:text-slate-400 text-right">${formatHariTanggalID(group.tgl)}</span>
                </div>
            `;

            let htmlList = '';
            group.items.forEach(item => {
                let barang = [...masterData.barangJadi, ...masterData.bahanBaku].find(b => b.id === item.barang_id);
                let bName = barang ? barang.nama : 'Barang Dihapus';
                let badgeColor = item.tipe === 'bahan' ? 'bg-red-50 text-red-600 border-red-100 dark:bg-red-900/30 dark:border-red-800' : 'bg-blue-50 text-blue-600 border-blue-100 dark:bg-blue-900/30 dark:border-blue-800';
                let textKet = item.keterangan ? `<div class="w-full mt-1 pt-1 border-t border-gray-200/60 text-[10px] text-gray-500 italic">Catatan: ${item.keterangan}</div>` : '';

                htmlList += `
                <li id="draft-item-${item.id}" class="flex flex-col bg-gray-50 dark:bg-slate-700/50 p-2.5 rounded-xl border border-gray-100 dark:border-slate-600 text-xs transition-all duration-300 origin-top overflow-hidden">
                    <div class="flex justify-between items-center w-full">
                        <div class="flex items-center gap-1.5">
                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ${badgeColor}">${item.tipe === 'bahan' ? 'Bahan' : 'Jadi'}</span>
                            <span class="font-semibold text-gray-700 dark:text-slate-300">${bName}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="font-black text-blue-600 dark:text-blue-400">Qty: ${item.qty}</span>
                            <button onclick="hapusCatatanHarian('${item.id}', '${key}')" class="text-red-400 hover:text-red-600 p-1 bg-white dark:bg-slate-800 rounded-lg border border-red-100 shadow-sm"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button>
                        </div>
                    </div>
                    ${textKet}
                </li>`;
            });

            document.getElementById('listDetailDraft').innerHTML = htmlList;
            openFormModal('modalDetailDraft');
            feather.replace();
        }

        let draftToDelete = null;

        function hapusCatatanHarian(id, groupKey = null) {
            draftToDelete = { id, groupKey };
            document.getElementById('inputPinHapus').value = '';
            openFormModal('modalPin');
        }

        async function prosesHapusCatatanHarian() {
            const pin = document.getElementById('inputPinHapus').value;
            if (pin !== "942715") {
                showNotification("PIN Salah!", "error");
                return;
            }

            if(!draftToDelete) return;
            const { id, groupKey } = draftToDelete;

            // 1. TUTUP MODAL PIN LANGSUNG AGAR TERASA INSTAN
            closeFormModal('modalPin');

            // 2. MANIPULASI DOM LANGSUNG UNTUK ANIMASI HILANG (SUPER REALTIME)
            const itemEl = document.getElementById(`draft-item-${id}`);
            if (itemEl) {
                itemEl.style.opacity = '0';
                itemEl.style.transform = 'scale(0.95)';
                itemEl.style.height = '0px';
                itemEl.style.padding = '0px';
                itemEl.style.marginBottom = '0px';
                itemEl.style.borderWidth = '0px';
            }

            // 3. UPDATE STATE DATA
            let isGroupEmpty = false;
            if (groupKey && globalDraftData[groupKey]) {
                globalDraftData[groupKey].items = globalDraftData[groupKey].items.filter(item => item.id !== id);
                if (globalDraftData[groupKey].items.length === 0) {
                    delete globalDraftData[groupKey];
                    isGroupEmpty = true;
                }
            }

            // 4. UPDATE BACKGROUND LIST & TUTUP MODAL JIKA KOSONG
            setTimeout(() => {
                if (isGroupEmpty) {
                    closeFormModal('modalDetailDraft');
                } else if (groupKey && globalDraftData[groupKey]) {
                    bukaDetailDraft(groupKey);
                }
                renderFilteredDrafts(); 
            }, 250);

            // 5. PROSES BACKEND (Berjalan diam-diam di latar belakang)
            try {
                const { error } = await supabaseClient.from('buku_harian').delete().eq('id', id);
                if(error) throw error;
                showNotification("Catatan dihapus!", "success");
            } catch (err) { 
                showNotification("Gagal menghapus: " + err.message, "error"); 
                fetchListHarian(); 
            } finally {
                draftToDelete = null;
            }
        }

        async function simpanCatatanHarian() {
            const tgl = document.getElementById('inputTglHarian').value;
            const rId = document.getElementById('inputResellerHarian').value;
            const inputBy = document.getElementById('inputByPegawai').value;
            
            if(!tgl || !rId) return showNotification("Lengkapi Tanggal dan Agen!", "error");
            if(!inputBy) return showNotification("Mohon pilih Input By (Nama Pegawai) terlebih dahulu!", "error");
            
            const rows = document.querySelectorAll('.row-input-harian');
            let dataToInsert = [];
            
            rows.forEach(row => {
                const bId = row.querySelector('.item-harian').value;
                const qty = parseFloat(row.querySelector('.qty-harian').value) || 0;
                const ket = row.querySelector('.keterangan-input')?.value || '';
                
                if (bId && qty > 0) {
                    const tipeOtomatis = masterData.bahanBaku.some(b => b.id === bId) ? 'bahan' : 'jadi';
                    dataToInsert.push({ 
                        reseller_id: rId, 
                        barang_id: bId, 
                        tanggal_setor: tgl, 
                        qty: qty, 
                        tipe: tipeOtomatis,
                        keterangan: ket,
                        is_paid: false,
                        input_by: inputBy
                    });
                }
            });

            if (dataToInsert.length === 0) return showNotification("Minimal isi 1 barang & qty > 0!", "error");
            
            const btn = document.getElementById('btnSimpanHarian');
            btn.innerHTML = `<i data-feather="loader" class="w-3.5 h-3.5 mr-1.5 animate-spin"></i> Menyimpan...`;
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.from('buku_harian').insert(dataToInsert);
                if(error) throw error;
                
                showNotification(`${dataToInsert.length} catatan disimpan!`, "success");
                
                lastSavedGroupKey = `${tgl}_${rId}`;

                const tzOffset = (new Date()).getTimezoneOffset() * 60000;
                document.getElementById('inputTglHarian').value = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);
                document.getElementById('inputResellerHarian').value = '';
                document.getElementById('inputByPegawai').value = '';
                document.getElementById('inputTipeHarian').value = 'semua';
                updateOpsiHarian();
                
                document.getElementById('containerHarianRows').innerHTML = '';
                for(let i=0; i<5; i++) {
                    addRowHarian();
                }
                
                await fetchListHarian();
                openFormModal('modalPostSave');
            } catch (err) {
                showNotification("Gagal menyimpan: " + err.message, "error");
            } finally {
                btn.innerHTML = `<i data-feather="save" class="w-3.5 h-3.5 mr-1.5"></i> Simpan Catatan`;
                btn.disabled = false;
                feather.replace();
            }
        }

        // ================= BLUETOOTH THERMAL PRINT (58MM) =================
        async function cetakDraftTerakhir() {
            if (!lastSavedGroupKey || !globalDraftData[lastSavedGroupKey]) {
                showNotification("Data draft tidak ditemukan untuk dicetak.", "error");
                return;
            }
            await prosesCetakBluetooth(globalDraftData[lastSavedGroupKey]);
            closeFormModal('modalPostSave');
        }

        async function cetakDraftKhusus(key) {
            if (!globalDraftData[key]) {
                showNotification("Data draft tidak ditemukan.", "error");
                return;
            }
            await prosesCetakBluetooth(globalDraftData[key]);
        }

        async function prosesCetakBluetooth(groupData) {
            try {
                if (!navigator.bluetooth) {
                    showNotification("Web Bluetooth tidak didukung di perangkat/browser Anda.", "error");
                    return;
                }
                showNotification("Menghubungkan ke printer thermal...", "info");
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '0000ff00-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455']
                });
                
                const server = await device.gatt.connect();
                const services = await server.getPrimaryServices();
                let targetCharacteristic = null;
                
                for (let s of services) {
                    const characteristics = await s.getCharacteristics();
                    for (let c of characteristics) {
                        if (c.properties.write || c.properties.writeWithoutResponse) {
                            targetCharacteristic = c;
                            break;
                        }
                    }
                    if (targetCharacteristic) break;
                }

                if (!targetCharacteristic) {
                    throw new Error("Karakteristik write printer bluetooth tidak ditemukan.");
                }

                let encoder = new TextEncoder();
                let commands = [];
                
                // ESC/POS Command: Inisialisasi
                commands.push(0x1B, 0x40);
                
                // Header (Center, Bold)
                commands.push(0x1B, 0x61, 0x01); 
                commands.push(0x1B, 0x45, 0x01); 
                commands.push(...encoder.encode("SBR RESELLER\n"));
                commands.push(0x1B, 0x45, 0x00); 
                commands.push(...encoder.encode("CATATAN PENGAMBILAN BAHAN BAKU\n"));
                commands.push(...encoder.encode("--------------------------------\n"));
                
                // Detail Reseller & Tanggal (Left)
                commands.push(0x1B, 0x61, 0x00);
                let reseller = masterData.resellers.find(r => r.id === groupData.reseller_id);
                let rName = reseller ? reseller.nama : 'Reseller';
                commands.push(...encoder.encode(`Reseller : ${rName}\n`));
                
                // Nama Hari
                const listHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
                const namaHari = listHari[new Date(groupData.tgl).getDay()];

                commands.push(...encoder.encode(`Hari/tgl : ${namaHari}, ${formatTanggalID(groupData.tgl)}\n`));
                commands.push(...encoder.encode("--------------------------------\n"));
                commands.push(...encoder.encode("QTY | NAMA BARANG\n"));
                commands.push(...encoder.encode("--------------------------------\n\n"));

                groupData.items.forEach(item => {
                    let barang = [...masterData.barangJadi, ...masterData.bahanBaku].find(b => b.id === item.barang_id);
                    let bName = barang ? barang.nama : 'Item';
                    commands.push(...encoder.encode(`${`${item.qty}x`.padEnd(4, ' ')}| ${bName}\n`));
                    if(item.keterangan) {
                        commands.push(...encoder.encode(`        Ket: ${item.keterangan}\n`));
                    }
                });
                
                commands.push(...encoder.encode("\n"));
                commands.push(0x1B, 0x61, 0x01); // Center
                commands.push(...encoder.encode(`Dibuat/disiapkan oleh : ${groupData.input_by || '-'}\n`));
                commands.push(...encoder.encode("--------------------------------\n"));
                commands.push(0x1B, 0x61, 0x01); // Center
                commands.push(...encoder.encode("MOHON CEK KEMBALI\n\n\n\n"));
                commands.push(0x1D, 0x56, 0x41, 0x03); // Cut

                // --- MODIFIKASI TRANSFER DATA BERTAHAP (CHUNKING) ---
                const rawData = new Uint8Array(commands);
                const CHUNK_SIZE = 64; 
                
                for (let i = 0; i < rawData.length; i += CHUNK_SIZE) {
                    const chunk = rawData.slice(i, i + CHUNK_SIZE);
                    await targetCharacteristic.writeValue(chunk);
                    await new Promise(resolve => setTimeout(resolve, 50)); 
                }
                // ---------------------------------------------------

                showNotification("Berhasil mencetak nota ke printer!", "success");
            } catch (err) {
                console.error(err);
                showNotification("Gagal cetak bluetooth: " + err.message, "error");
            }
        }

        function openFormModal(id) {
            document.getElementById(id).classList.remove('hidden');
            feather.replace();
        }

        function closeFormModal(id) {
            document.getElementById(id).classList.add('hidden');
        }

        window.onload = () => {
            loadMasterData();
        };
    </script>
