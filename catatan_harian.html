<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Catatan Harian - SBR Putra Food</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        input, select { transition: all 0.2s ease-in-out; }
        input:focus, select:focus { outline: none; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.1); }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex items-start justify-center">

    <!-- Toast Notification Container -->
    <div id="toastContainer" class="fixed bottom-4 right-4 z-[110] flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN CONTAINER (Sebagai pengganti Modal) -->
    <div class="bg-white w-full max-w-5xl rounded-2xl shadow-lg border border-gray-100 flex flex-col h-[85vh] md:h-[750px] overflow-hidden">
        
        <!-- Header -->
        <div class="flex justify-between items-center p-4 border-b border-gray-100 bg-gray-50/50 shrink-0">
            <h3 class="text-sm font-bold text-gray-800 flex items-center">
                <i data-feather="edit-3" class="w-4 h-4 mr-2 text-blue-500"></i> Catatan Harian Multi-Baris (Standalone)
            </h3>
            <!-- Status Koneksi -->
            <div class="flex items-center space-x-1.5 bg-yellow-50 px-2.5 py-1 rounded-full border border-yellow-100 shadow-sm" id="status-connection">
                <span class="relative flex h-2 w-2"><span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span><span class="relative inline-flex rounded-full h-2 w-2 bg-yellow-500"></span></span>
                <span id="text-connection" class="text-[10px] font-semibold text-yellow-700 tracking-wide">Loading...</span>
            </div>
        </div>
        
        <!-- Body Kontainer (Kiri Input, Kanan Draft) -->
        <div class="flex flex-col md:flex-row flex-1 overflow-hidden bg-white">
            
            <!-- KIRI: Form Input Harian Multi Barang -->
            <div class="w-full md:w-1/2 border-b md:border-b-0 md:border-r border-gray-100 p-4 bg-white overflow-y-auto flex flex-col">
                
                <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-4 shrink-0">
                    <div class="col-span-1">
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Tanggal</label>
                        <input type="date" id="inputTglHarian" class="w-full text-xs p-2 rounded-lg border border-gray-300 bg-white outline-none focus:border-blue-500">
                    </div>
                    <div class="col-span-1">
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Agen / Reseller</label>
                        <select id="inputResellerHarian" class="w-full text-xs p-2 rounded-lg border border-gray-300 bg-white outline-none focus:border-blue-500">
                            <option value="">Loading...</option>
                        </select>
                    </div>
                    <div class="col-span-2 md:col-span-1">
                        <label class="block text-[11px] font-bold text-gray-600 mb-1">Fokus Tipe Input</label>
                        <select id="inputTipeHarian" onchange="updateOpsiHarian()" class="w-full text-xs p-2 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 font-semibold outline-none focus:border-blue-500 transition-colors">
                            <option value="semua">Tampilkan Semua</option>
                            <option value="jadi">📦 Barang Jadi</option>
                            <option value="bahan">🌾 Bahan Baku</option>
                        </select>
                    </div>
                </div>

                <div class="flex-1 overflow-y-auto custom-scroll pr-2 mb-4" id="containerHarianRows">
                    <!-- Baris Input dibuat via JS -->
                </div>

                <div class="shrink-0 flex gap-2 pt-3 border-t border-gray-100 mt-auto">
                    <button onclick="addRowHarian()" class="bg-blue-50 hover:bg-blue-100 text-blue-600 text-xs font-bold px-3 py-2.5 rounded-lg shadow-sm transition flex items-center justify-center border border-blue-200">
                        <i data-feather="plus" class="w-3.5 h-3.5 mr-1"></i> Baris
                    </button>
                    <button id="btnSimpanHarian" onclick="simpanCatatanHarian()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold px-4 py-2.5 rounded-lg shadow-sm transition flex items-center justify-center">
                        <i data-feather="save" class="w-3.5 h-3.5 mr-1.5"></i> Simpan Catatan
                    </button>
                </div>
            </div>
            
            <!-- KANAN: List Rekap Berkelompok -->
            <div class="w-full md:w-1/2 p-4 flex flex-col h-full overflow-hidden bg-gray-50/30">
                <h4 class="text-[11px] font-bold text-gray-500 uppercase mb-3 flex justify-between items-center">
                    Daftar Draft Tersimpan
                    <button onclick="fetchListHarian()" class="text-blue-500 hover:text-blue-600 flex items-center gap-1 normal-case bg-blue-50 px-2 py-1 rounded border border-blue-100 transition">
                        <i data-feather="refresh-cw" class="w-3 h-3"></i> Segarkan
                    </button>
                </h4>
                <div class="flex-1 overflow-y-auto custom-scroll pr-1 space-y-3" id="listCatatanHarian">
                    <div class="flex justify-center py-4"><i data-feather="loader" class="w-5 h-5 animate-spin text-blue-500"></i></div>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL DETAIL DRAFT TERSIMPAN -->
    <div id="modalDetailDraft" class="fixed inset-0 z-[70] flex items-center justify-center hidden p-4 pointer-events-none">
        <div class="absolute inset-0 bg-gray-900/60 backdrop-blur-sm pointer-events-auto transition-opacity" onclick="closeFormModal('modalDetailDraft')"></div>
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl relative z-10 flex flex-col max-h-[85vh] pointer-events-auto transform scale-95 transition-all duration-200">
            <div class="flex justify-between items-center p-4 border-b border-gray-100">
                <h3 class="text-sm font-bold text-gray-800 flex items-center">
                    <i data-feather="list" class="w-4 h-4 mr-2 text-blue-500"></i> Rincian Draft Tersimpan
                </h3>
                <button onclick="closeFormModal('modalDetailDraft')" class="text-gray-400 hover:text-gray-600 p-1 bg-gray-50 rounded-lg"><i data-feather="x" class="w-4 h-4"></i></button>
            </div>
            <div class="p-4 overflow-y-auto custom-scroll space-y-3">
                <div id="headerDetailDraft" class="mb-2 border-b border-gray-100 pb-3"></div>
                <ul id="listDetailDraft" class="space-y-2"></ul>
            </div>
        </div>
    </div>

    <!-- SCRIPT LOGIKA -->
    <script>
        feather.replace();

        // Helpers
        function formatTanggalID(dateStr) {
            if(!dateStr) return '-';
            const d = new Date(dateStr);
            const day = String(d.getDate()).padStart(2, '0');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Ags', 'Sep', 'Okt', 'Nov', 'Des'];
            return `${day}/${months[d.getMonth()]}/${String(d.getFullYear()).slice(-2)}`;
        }

        function showNotification(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-emerald-600' : (type === 'error' ? 'bg-red-600' : 'bg-blue-600');
            const icon = type === 'success' ? 'check-circle' : (type === 'error' ? 'alert-octagon' : 'info');
            
            toast.className = `${colorClass} text-white px-4 py-3 rounded-lg shadow-xl transform transition-all duration-300 translate-y-10 opacity-0 flex items-center gap-2.5 text-xs font-bold tracking-wide pointer-events-auto`;
            toast.innerHTML = `<i data-feather="${icon}" class="w-4 h-4"></i> ${message}`;
            container.appendChild(toast); feather.replace();
            setTimeout(() => { toast.classList.remove('translate-y-10', 'opacity-0'); }, 10);
            setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3500);
        }

        function openFormModal(id) {
            const el = document.getElementById(id);
            el.classList.remove('hidden');
            setTimeout(() => { el.children[1].classList.replace('scale-95', 'scale-100'); }, 10);
        }

        function closeFormModal(id) {
            const el = document.getElementById(id);
            if(el.children[1]) el.children[1].classList.replace('scale-100', 'scale-95');
            setTimeout(() => { el.classList.add('hidden'); }, 200);
        }

        // Setup Database
        const supabaseUrl = 'https://uocvuddqhviorebinpva.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVvY3Z1ZGRxaHZpb3JlYmlucHZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU2OTQ0NDAsImV4cCI6MjEwMTI3MDQ0MH0.mWGTOTfHG4Q62S3P4LQi-5bGviMPWgMzo2p2AECquL8';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let masterData = { resellers: [], barangJadi: [], bahanBaku: [] };
        let globalDraftData = {};

        async function loadMasterData() {
            try {
                const [resellersData, barangData] = await Promise.all([
                    supabaseClient.from('reseller').select('*'),
                    supabaseClient.from('barang').select('*')
                ]);

                if (resellersData.error) throw resellersData.error;
                if (barangData.error) throw barangData.error;

                masterData.resellers = resellersData.data.map(r => ({ id: r.id, nama: r.nama_reseller }));
                masterData.barangJadi = []; 
                masterData.bahanBaku = [];

                barangData.data.forEach(b => {
                    if (b.tipe === 'jadi') masterData.barangJadi.push({ id: b.id, nama: b.nama_barang });
                    else masterData.bahanBaku.push({ id: b.id, nama: b.nama_barang });
                });

                // Update UI Koneksi Berhasil
                const statusConn = document.getElementById('status-connection');
                statusConn.classList.replace('bg-yellow-50', 'bg-green-50');
                statusConn.classList.replace('border-yellow-100', 'border-green-100');
                statusConn.querySelector('.animate-ping').classList.replace('bg-yellow-400', 'bg-green-400');
                statusConn.querySelector('.relative.inline-flex').classList.replace('bg-yellow-500', 'bg-green-500');
                
                const txt = document.getElementById('text-connection');
                txt.innerText = 'Connected'; txt.classList.replace('text-yellow-700', 'text-green-700');

                // Populasi Dropdown Reseller
                const selRes = document.getElementById('inputResellerHarian');
                selRes.innerHTML = '<option value="">Pilih Agen / Reseller...</option>';
                masterData.resellers.forEach(r => selRes.innerHTML += `<option value="${r.id}">${r.nama}</option>`);

                // Update opsi form multi-baris
                updateOpsiHarian();

            } catch (error) {
                const statusConn = document.getElementById('status-connection');
                statusConn.classList.replace('bg-yellow-50', 'bg-red-50');
                const txt = document.getElementById('text-connection');
                txt.innerText = 'Error Database'; txt.classList.replace('text-yellow-700', 'text-red-700');
                showNotification("Gagal terhubung ke Database Supabase.", "error");
            }
        }

        // Logika Form & Opsi Barang
        function getOptionsHarianHtml(tipeFokus = 'semua') {
            let html = '<option value="">Pilih Barang / Bahan...</option>';
            if (tipeFokus === 'semua' || tipeFokus === 'jadi') {
                html += '<optgroup label="📦 BARANG JADI">';
                masterData.barangJadi.forEach(b => html += `<option value="${b.id}">${b.nama}</option>`);
                html += '</optgroup>';
            }
            if (tipeFokus === 'semua' || tipeFokus === 'bahan') {
                html += '<optgroup label="🌾 BAHAN BAKU">';
                masterData.bahanBaku.forEach(b => html += `<option value="${b.id}">${b.nama}</option>`);
                html += '</optgroup>';
            }
            return html;
        }

        function updateOpsiHarian() {
            const tipeFokus = document.getElementById('inputTipeHarian').value;
            const newHtml = getOptionsHarianHtml(tipeFokus);
            document.querySelectorAll('.item-harian').forEach(select => {
                const currentVal = select.value;
                select.innerHTML = newHtml;
                const exists = Array.from(select.options).some(opt => opt.value === currentVal);
                if(exists) select.value = currentVal;
            });
        }

        function addRowHarian() {
            const container = document.getElementById('containerHarianRows');
            const tipeFokus = document.getElementById('inputTipeHarian')?.value || 'semua';
            const div = document.createElement('div');
            div.className = 'flex gap-2 row-input-harian mb-2 items-center';
            div.innerHTML = `
                <div class="w-8/12">
                    <select class="item-harian w-full text-xs p-2.5 rounded-lg border border-gray-300 bg-white outline-none focus:border-blue-500 shadow-sm">
                        ${getOptionsHarianHtml(tipeFokus)}
                    </select>
                </div>
                <div class="w-3/12">
                    <input type="number" placeholder="Qty" min="1" class="qty-harian w-full text-xs p-2.5 rounded-lg border border-gray-300 bg-white outline-none focus:border-blue-500 text-center shadow-sm">
                </div>
                <div class="w-1/12 text-right">
                    <button type="button" onclick="this.parentElement.parentElement.remove()" class="text-red-400 hover:text-red-600 p-1.5 bg-red-50 hover:bg-red-100 rounded-lg transition" title="Hapus Baris"><i data-feather="x" class="w-4 h-4"></i></button>
                </div>
            `;
            container.appendChild(div);
            feather.replace();
        }

        // Menyimpan Catatan Harian ke Supabase
        async function simpanCatatanHarian() {
            const tgl = document.getElementById('inputTglHarian').value;
            const rId = document.getElementById('inputResellerHarian').value;
            
            if(!tgl || !rId) return showNotification("Harap lengkapi Tanggal dan Agen!", "error");
            
            const rows = document.querySelectorAll('.row-input-harian');
            let dataToInsert = [];
            
            rows.forEach(row => {
                const bId = row.querySelector('.item-harian').value;
                const qty = parseFloat(row.querySelector('.qty-harian').value) || 0;
                
                if (bId && qty > 0) {
                    const tipeOtomatis = masterData.bahanBaku.some(b => b.id === bId) ? 'bahan' : 'jadi';
                    dataToInsert.push({ 
                        reseller_id: rId, 
                        barang_id: bId, 
                        tanggal_setor: tgl, 
                        qty: qty, 
                        tipe: tipeOtomatis, 
                        is_paid: false 
                    });
                }
            });

            if (dataToInsert.length === 0) return showNotification("Minimal isi 1 barang dengan Qty lebih dari 0!", "error");
            
            const btn = document.getElementById('btnSimpanHarian');
            btn.innerHTML = `<i data-feather="loader" class="w-3.5 h-3.5 mr-1.5 animate-spin"></i> Menyimpan...`;
            btn.disabled = true;

            try {
                const { error } = await supabaseClient.from('buku_harian').insert(dataToInsert);
                if(error) throw error;
                
                showNotification(`${dataToInsert.length} baris catatan berhasil disimpan!`, "success");
                
                // Reset baris jadi kosong, kembalikan ke default 5 baris
                document.getElementById('containerHarianRows').innerHTML = '';
                for(let i=0; i<5; i++) { addRowHarian(); }
                
                fetchListHarian();
            } catch (err) {
                showNotification("Gagal menyimpan: " + err.message, "error");
            } finally {
                btn.innerHTML = `<i data-feather="save" class="w-3.5 h-3.5 mr-1.5"></i> Simpan Catatan`;
                btn.disabled = false;
                feather.replace();
            }
        }

        // Fetch & List Daftar Tersimpan
        async function fetchListHarian() {
            const container = document.getElementById('listCatatanHarian');
            container.innerHTML = `<div class="flex justify-center py-8"><i data-feather="loader" class="w-6 h-6 animate-spin text-blue-500"></i></div>`;
            feather.replace();
            try {
                const { data, error } = await supabaseClient.from('buku_harian').select('*').eq('is_paid', false).order('tanggal_setor', { ascending: false });
                if(error) throw error;
                if(!data || data.length === 0) {
                    container.innerHTML = '<div class="text-center text-gray-400 text-xs py-8 italic border-2 border-dashed border-gray-200 rounded-xl">Belum ada catatan harian.</div>';
                    return;
                }
                
                globalDraftData = {};
                data.forEach(d => {
                    let key = `${d.tanggal_setor}_${d.reseller_id}`;
                    if(!globalDraftData[key]) {
                        globalDraftData[key] = { tgl: d.tanggal_setor, reseller_id: d.reseller_id, items: [] };
                    }
                    globalDraftData[key].items.push(d);
                });

                let html = '';
                Object.keys(globalDraftData).forEach(key => {
                    let group = globalDraftData[key];
                    let reseller = masterData.resellers.find(r => r.id === group.reseller_id);
                    let rName = reseller ? reseller.nama : 'Unknown Reseller';
                    let formattedDate = formatTanggalID(group.tgl);
                    let totalItems = group.items.length;

                    html += `
                    <div onclick="bukaDetailDraft('${key}')" class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm text-xs mb-3 cursor-pointer hover:border-blue-400 hover:shadow-md transition group">
                        <div class="flex justify-between items-center">
                            <span class="font-black text-gray-800 flex items-center gap-1.5"><i data-feather="user" class="w-3.5 h-3.5 text-blue-500"></i> ${rName}</span>
                            <span class="bg-blue-50 text-blue-600 font-bold px-2 py-0.5 rounded text-[10px]">${formattedDate}</span>
                        </div>
                        <div class="mt-2.5 pt-2 border-t border-gray-100 text-[10px] text-gray-500 flex justify-between items-center">
                            <span>Menyimpan <strong class="text-blue-500">${totalItems} rincian</strong> barang.</span>
                            <span class="text-blue-500 font-semibold group-hover:underline">Buka Detail &rarr;</span>
                        </div>
                    </div>`;
                });

                container.innerHTML = html;
                feather.replace();
            } catch (err) {
                container.innerHTML = `<div class="text-center text-red-500 text-xs py-4">Gagal memuat: ${err.message}</div>`;
            }
        }

        // Buka Pop-up Rincian Draft
        function bukaDetailDraft(key) {
            const group = globalDraftData[key];
            if(!group) return;

            let reseller = masterData.resellers.find(r => r.id === group.reseller_id);
            let rName = reseller ? reseller.nama : 'Unknown Reseller';
            let formattedDate = formatTanggalID(group.tgl);

            document.getElementById('headerDetailDraft').innerHTML = `
                <div class="flex justify-between items-center">
                    <span class="font-black text-gray-800 text-sm">${rName}</span>
                    <span class="text-xs font-semibold text-gray-500">${formattedDate}</span>
                </div>
            `;

            let htmlList = '';
            group.items.forEach(item => {
                let barang = [...masterData.barangJadi, ...masterData.bahanBaku].find(b => b.id === item.barang_id);
                let bName = barang ? barang.nama : 'Barang Dihapus';
                let badgeColor = item.tipe === 'bahan' ? 'bg-red-50 text-red-600 border-red-100' : 'bg-blue-50 text-blue-600 border-blue-100';
                let badgeText = item.tipe === 'bahan' ? 'Bahan' : 'Jadi';

                htmlList += `
                <li class="flex justify-between items-center bg-gray-50/70 p-2.5 rounded-xl border border-gray-100">
                    <div class="flex items-center gap-2">
                        <span class="text-[9px] font-bold px-1.5 py-0.5 rounded border ${badgeColor}">${badgeText}</span>
                        <span class="font-semibold text-gray-700 text-xs">${bName}</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="font-black text-blue-600 text-xs">Qty: ${item.qty}</span>
                        <button onclick="hapusCatatanHarian('${item.id}', '${key}')" class="text-red-400 hover:text-red-600 p-1.5 rounded-lg transition bg-white border border-red-100 shadow-sm"><i data-feather="trash-2" class="w-3.5 h-3.5"></i></button>
                    </div>
                </li>`;
            });

            document.getElementById('listDetailDraft').innerHTML = htmlList;
            openFormModal('modalDetailDraft');
            feather.replace();
        }

        // Hapus spesifik isi rincian
        async function hapusCatatanHarian(id, groupKey = null) {
            if(!confirm("Yakin ingin menghapus catatan ini?")) return;
            try {
                const { error } = await supabaseClient.from('buku_harian').delete().eq('id', id);
                if(error) throw error;
                showNotification("Catatan dihapus!", "success");

                if (groupKey && globalDraftData[groupKey]) {
                    globalDraftData[groupKey].items = globalDraftData[groupKey].items.filter(item => item.id !== id);
                    if (globalDraftData[groupKey].items.length === 0) {
                        delete globalDraftData[groupKey];
                        closeFormModal('modalDetailDraft');
                    } else {
                        bukaDetailDraft(groupKey); 
                    }
                }
                fetchListHarian(); 
            } catch (err) { showNotification("Gagal menghapus: " + err.message, "error"); }
        }

        // Auto Eksekusi saat halaman pertama dimuat
        window.onload = () => {
            // Set Tanggal Hari Ini Default
            const tzOffset = (new Date()).getTimezoneOffset() * 60000;
            document.getElementById('inputTglHarian').value = (new Date(Date.now() - tzOffset)).toISOString().slice(0, 10);
            
            // Tarik Database & Buka baris default
            loadMasterData().then(() => { 
                document.getElementById('containerHarianRows').innerHTML = '';
                for(let i=0; i<5; i++) {
                    addRowHarian(); 
                }
                fetchListHarian();
            });
        };
    </script>
</body>
</html>
