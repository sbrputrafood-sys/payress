<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SBR Putra Food - Tabungan</title>
    
    <!-- SCRIPT CDN SUPABASE & FONTAWESOME -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- PWA META TAGS STANDALONE -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SBR Tabungan">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#E1C4FF">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/sbrputrafood-sys/payress/3e98b9797affc74211878c59439be66c3e99d5bc/sbr_logo.png">
    <link rel="manifest" id="pwa-manifest">

    <style>
        :root {
            --primary: #E1C4FF;
            --primary-dark: #C293FF;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-main: #1f2937; 
            --text-muted: #6b7280;
            --danger: #ef4444;
            --success: #10b981; 
            --text-on-primary: #1f2937; 
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            color: var(--text-main);
        }

        #app-container {
            width: 100%;
            max-width: 480px;
            background-color: var(--card-bg);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            overflow-x: hidden;
        }

        .hidden { display: none !important; }

        /* --- HALAMAN LOGIN --- */
        #login-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 2rem;
            text-align: center;
        }

        .logo-img {
            width: 110px;
            height: auto;
            margin-bottom: 1.5rem;
            border-radius: 16px;
        }

        .login-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .login-subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        .input-group {
            width: 100%;
            margin-bottom: 1rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
            text-align: center;
        }

        input:focus { border-color: var(--primary-dark); }

        button.btn-primary {
            width: 100%;
            padding: 1rem;
            background-color: var(--primary);
            color: var(--text-on-primary); 
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button.btn-primary:active { background-color: var(--primary-dark); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }

        /* --- HALAMAN DASHBOARD & ADMIN --- */
        .header {
            background-color: var(--primary);
            color: var(--text-on-primary); 
            padding: 2rem 1.5rem 3rem 1.5rem;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .header-top-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-top-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .action-btn {
            background: rgba(0, 0, 0, 0.05);
            border: none;
            color: var(--text-on-primary);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        
        .action-btn:hover { background: rgba(0, 0, 0, 0.1); }

        .action-btn-icon {
            padding: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
        }

        .saldo-title {
            font-size: 0.9rem;
            opacity: 0.8;
            margin-bottom: 0.5rem;
        }

        .saldo-amount {
            font-size: 2.2rem;
            font-weight: 700;
        }

        .content {
            padding: 0 1.25rem; 
            margin-top: -1.5rem;
            padding-bottom: 2rem;
        }

        .card-riwayat {
            background-color: white;
            border-radius: 16px;
            padding: 1.25rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .riwayat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .riwayat-title {
            font-weight: 600;
            font-size: 1rem;
        }

        /* --- STYLING DAFTAR --- */
        .list-riwayat {
            display: flex;
            flex-direction: column;
            gap: 0.75rem; 
        }

        .item-riwayat {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 0.75rem;
            border-bottom: 1px solid #f3f4f6;
        }

        .item-riwayat:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .item-clickable {
            cursor: pointer;
            transition: background-color 0.2s;
            border-radius: 8px;
            padding: 0.5rem;
            margin: -0.5rem; 
        }
        .item-clickable:hover { background-color: #f9fafb; }

        .item-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            overflow: hidden; 
            flex-grow: 1; 
        }

        .icon-jenis {
            width: 36px; 
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            flex-shrink: 0; 
        }

        .icon-masuk { background-color: #d1fae5; color: var(--success); }
        .icon-keluar { background-color: #fee2e2; color: var(--danger); }
        .icon-user { background-color: #e0f2fe; color: #0284c7; }
        .icon-key { background-color: #fef3c7; color: #d97706; }

        .item-info { overflow: hidden; }
        .item-info h4 {
            font-size: 0.85rem; 
            margin-bottom: 0.15rem;
            color: var(--text-main);
            white-space: nowrap; 
            overflow: hidden;
            text-overflow: ellipsis; 
        }

        .item-info p { font-size: 0.7rem; color: var(--text-muted); }

        .item-nominal {
            font-weight: 600;
            font-size: 0.85rem; 
            white-space: nowrap; 
            flex-shrink: 0; 
            text-align: right;
            margin-left: 0.5rem; 
        }

        .nominal-masuk { color: var(--success); } 
        .nominal-keluar { color: var(--text-main); }
        .nominal-netral { color: var(--text-main); }
        
        .loading-text { text-align: center; color: var(--text-muted); font-size: 0.85rem; }

        /* --- MODAL EDIT PIN --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); 
            display: flex; align-items: center; justify-content: center;
            z-index: 50;
            opacity: 1; transition: opacity 0.2s;
        }
        .modal-overlay.hidden { display: none !important; opacity: 0; pointer-events: none; }
        .modal-box {
            background: var(--card-bg); padding: 1.5rem; border-radius: 16px; 
            width: 90%; max-width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }
        .modal-box h3 { margin-bottom: 0.25rem; font-size: 1.1rem; }
        .modal-box p { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 1.25rem; }
        .modal-box input { margin-bottom: 1.25rem; width: 100%; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 0.5rem; }
        
        .btn-batal { 
            background: #f3f4f6; color: var(--text-main); padding: 0.6rem 1rem; 
            border-radius: 8px; border: none; font-weight: 600; cursor: pointer; 
        }
        .btn-simpan { 
            background: var(--primary); color: var(--text-main); padding: 0.6rem 1rem; 
            border-radius: 8px; border: none; font-weight: 600; cursor: pointer; 
        }
        .btn-batal:hover { background: #e5e7eb; }
        .btn-simpan:hover { background: var(--primary-dark); }
        .btn-simpan:disabled { opacity: 0.7; cursor: not-allowed; }

        /* --- MODERN BOTTOM SHEET ALERT (MODERN BOTTOM BAR) --- */
        .bottom-alert-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.45);
            backdrop-filter: blur(2px);
            display: flex; align-items: flex-end; justify-content: center;
            z-index: 100;
            opacity: 1; transition: opacity 0.3s ease;
        }
        .bottom-alert-overlay.hidden {
            display: none !important; opacity: 0; pointer-events: none;
        }
        .bottom-alert-sheet {
            background: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 1.5rem 1.25rem 2rem 1.25rem;
            border-top-left-radius: 28px;
            border-top-right-radius: 28px;
            box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            animation: slideUpSheet 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .bottom-alert-icon {
            width: 52px; height: 52px; border-radius: 50%;
            background-color: #fee2e2; color: var(--danger);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; margin-bottom: 1rem;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
        }
        .bottom-alert-content h4 {
            font-size: 1.05rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.3rem;
        }
        .bottom-alert-content p {
            font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.5rem; line-height: 1.4;
        }
        .bottom-alert-btn {
            width: 100%; padding: 0.9rem;
            background-color: var(--text-main); color: #ffffff;
            border: none; border-radius: 14px; font-weight: 600;
            font-size: 0.95rem; cursor: pointer;
            transition: opacity 0.2s;
        }
        .bottom-alert-btn:active { opacity: 0.85; }
    </style>
</head>
<body>

<div id="app-container">
    
    <!-- LAYAR LOGIN -->
    <div id="login-screen">
        <img src="https://raw.githubusercontent.com/sbrputrafood-sys/payress/3e98b9797affc74211878c59439be66c3e99d5bc/sbr_logo.png" alt="SBR Putra Food Logo" class="logo-img">
        
        <h1 class="login-title">SBR Putra Food</h1>
        <p class="login-subtitle">Portal Tabungan Karyawan</p>
        
        <div class="input-group">
            <input type="text" id="inputIdKaryawan" placeholder="ID Karyawan / Nama" autocomplete="off">
        </div>
        <div class="input-group">
            <input type="password" id="inputPassword" placeholder="Masukkan Password / PIN" autocomplete="off">
        </div>
        <button id="btnLogin" class="btn-primary" onclick="prosesLogin()">Masuk</button>
    </div>

    <!-- LAYAR ADMIN -->
    <div id="admin-screen" class="hidden">
        <div class="header">
            <div class="header-top">
                <div class="header-top-left">
                    <div>
                        <p style="font-size: 0.8rem; opacity: 0.8;">Halo Super Admin,</p>
                        <h3 id="namaAdmin">Nama Admin</h3>
                    </div>
                </div>
                <div class="header-top-right">
                    <button class="action-btn action-btn-icon" onclick="bukaLayarPin()" title="Manajemen PIN Karyawan">
                        <i class="fa-solid fa-key"></i>
                    </button>
                    <button class="action-btn" onclick="prosesLogout()">Keluar</button>
                </div>
            </div>
            <p class="saldo-title">Total Seluruh Tabungan</p>
            <h1 class="saldo-amount" id="totalSaldoAdmin">Rp 0</h1>
        </div>

        <div class="content">
            <div class="card-riwayat">
                <div class="riwayat-header">
                    <span class="riwayat-title">Daftar Karyawan</span>
                </div>
                <div class="list-riwayat" id="listKaryawanAdmin"></div>
            </div>
        </div>
    </div>

    <!-- LAYAR MANAJEMEN PIN KARYAWAN -->
    <div id="pin-screen" class="hidden">
        <div class="header" style="padding-bottom: 2rem;">
            <div class="header-top">
                <div class="header-top-left">
                    <button class="action-btn action-btn-icon" onclick="tutupLayarPin()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div>
                        <h3 style="margin-left: 10px;">Akses & PIN</h3>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="content">
            <div class="card-riwayat">
                <div class="riwayat-header">
                    <span class="riwayat-title">Daftar PIN Karyawan</span>
                </div>
                <div class="list-riwayat" id="listKaryawanPin"></div>
            </div>
        </div>
    </div>

    <!-- LAYAR DASHBOARD / DETAIL KARYAWAN -->
    <div id="dashboard-screen" class="hidden">
        <div class="header">
            <div class="header-top">
                <div class="header-top-left">
                    <button id="btnBackAdmin" class="action-btn action-btn-icon hidden" onclick="kembaliKeAdmin()">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>
                    <div>
                        <p id="labelSapaan" style="font-size: 0.8rem; opacity: 0.8;">Halo,</p>
                        <h3 id="namaKaryawan">Nama Karyawan</h3>
                    </div>
                </div>
                <button id="btnLogout" class="action-btn" onclick="prosesLogout()">Keluar</button>
            </div>
            <p class="saldo-title">Total Tabungan</p>
            <h1 class="saldo-amount" id="totalSaldo">Rp 0</h1>
        </div>

        <div class="content">
            <div class="card-riwayat">
                <div class="riwayat-header">
                    <span class="riwayat-title">Riwayat Terakhir</span>
                </div>
                <div class="list-riwayat" id="listRiwayat"></div>
            </div>
        </div>
    </div>

    <!-- MODAL EDIT PIN -->
    <div id="modalPin" class="modal-overlay hidden">
        <div class="modal-box">
            <h3>Atur PIN Login</h3>
            <p id="modalNamaKaryawan">Nama Karyawan</p>
            <input type="text" id="inputPinBaru" placeholder="Masukkan PIN baru" autocomplete="off">
            <div class="modal-actions">
                <button class="btn-batal" onclick="tutupModalPin()">Batal</button>
                <button class="btn-simpan" id="btnSimpanPin" onclick="simpanPinBaru()">Simpan</button>
            </div>
        </div>
    </div>

    <!-- MODERN BOTTOM SHEET ALERT -->
    <div id="bottomAlertOverlay" class="bottom-alert-overlay hidden">
        <div class="bottom-alert-sheet">
            <div class="bottom-alert-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <div class="bottom-alert-content">
                <h4 id="bottomAlertTitle">Perhatian</h4>
                <p id="bottomAlertMessage">Pesan informasi error di sini...</p>
            </div>
            <button class="bottom-alert-btn" onclick="tutupBottomAlert()">Mengerti</button>
        </div>
    </div>

</div>

<script>
    // ==========================================
    // 0. SCRIPT STANDALONE PWA
    // ==========================================
    const pwaManifest = {
      name: "SBR Putra Food",
      short_name: "SBR Tabungan",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#f3f4f6",
      theme_color: "#E1C4FF",
      icons: [{
        src: "https://raw.githubusercontent.com/sbrputrafood-sys/payress/3e98b9797affc74211878c59439be66c3e99d5bc/sbr_logo.png",
        sizes: "192x192",
        type: "image/png"
      }]
    };
    
    const manifestBlob = new Blob([JSON.stringify(pwaManifest)], {type: 'application/manifest+json'});
    document.querySelector('#pwa-manifest').setAttribute('href', URL.createObjectURL(manifestBlob));

    if ('serviceWorker' in navigator) {
        const swCode = `
            self.addEventListener('install', (e) => { self.skipWaiting(); });
            self.addEventListener('fetch', (e) => { });
        `;
        const swBlob = new Blob([swCode], {type: 'application/javascript'});
        navigator.serviceWorker.register(URL.createObjectURL(swBlob))
            .catch(err => console.log('PWA Service Worker Gagal:', err));
    }

    // ==========================================
    // 1. KONFIGURASI SUPABASE
    // ==========================================
    const SUPABASE_URL = 'https://ephcczlqvtihmbowqxdt.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVwaGNjemxxdnRpaG1ib3dxeGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQwOTgxNTMsImV4cCI6MjA5OTY3NDE1M30.Ky9XSDmsqVBrOrWOMJaMY6gzE8Z32eXxZ6cqdACp_2M';
    
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    let dataKaryawanAktif = null;
    let targetKaryawanEditId = null;

    function formatRupiah(angka) {
        return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka || 0);
    }

    function formatTanggal(isoString) {
        if (!isoString) return '-';
        const date = new Date(isoString);
        return date.toLocaleDateString('id-ID', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute:'2-digit' });
    }

    // --- HELPER BOTTOM SHEET ALERT ---
    function showBottomAlert(title, message) {
        document.getElementById('bottomAlertTitle').innerText = title;
        document.getElementById('bottomAlertMessage').innerText = message;
        document.getElementById('bottomAlertOverlay').classList.remove('hidden');
    }

    function tutupBottomAlert() {
        document.getElementById('bottomAlertOverlay').classList.add('hidden');
    }

    // ==========================================
    // 2. FUNGSI LOGIN & CEK PASSWORD
    // ==========================================
    async function prosesLogin() {
        const inputId = document.getElementById('inputIdKaryawan').value.trim();
        const inputPass = document.getElementById('inputPassword').value.trim();
        const btnLogin = document.getElementById('btnLogin');
        
        if(!inputId || !inputPass) {
            showBottomAlert("Form Belum Lengkap", "Harap masukkan ID/Nama dan Password terlebih dahulu.");
            return;
        }

        btnLogin.disabled = true;
        btnLogin.innerText = "Memeriksa...";

        try {
            let query = db.from('karyawan').select('*');
            
            if (/^\d+$/.test(inputId)) {
                query = query.eq('id', inputId);
            } else {
                query = query.ilike('nama', `%${inputId}%`);
            }

            const { data, error } = await query.maybeSingle();

            if (error || !data) {
                showBottomAlert("Gagal Masuk", "Data Karyawan tidak ditemukan!");
                resetBtn(); 
                return;
            }

            if (String(data.password) !== String(inputPass)) {
                showBottomAlert("Gagal Masuk", "Password salah, silakan coba lagi!");
                resetBtn(); 
                return;
            }

            dataKaryawanAktif = data;
            
            // --- LOGIKA SUPER ADMIN (ID = 1, PIN = 749947) ---
            if (String(data.id) === "1" && String(inputPass) === "749947") {
                tampilkanLayarAdmin(data);
            } else {
                loadDashboardView(data, false);
            }

        } catch (err) {
            showBottomAlert("Kesalahan Sistem", "Terjadi kesalahan saat mencoba terhubung ke database.");
            console.error(err);
            resetBtn();
        }
    }

    function resetBtn() {
        const btnLogin = document.getElementById('btnLogin');
        btnLogin.disabled = false;
        btnLogin.innerText = "Masuk";
    }

    // ==========================================
    // 3. FUNGSI LAYAR ADMIN UTAMA
    // ==========================================
    async function tampilkanLayarAdmin(adminData) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');

        document.getElementById('namaAdmin').innerText = adminData.nama;

        const container = document.getElementById('listKaryawanAdmin');
        container.innerHTML = `<p class="loading-text">Memuat data karyawan...</p>`;

        const { data: karyawanList, error } = await db
            .from('karyawan')
            .select('*')
            .order('nama', { ascending: true });

        if (error || !karyawanList) {
            container.innerHTML = `<p class="loading-text">Gagal memuat data karyawan.</p>`;
            return;
        }

        container.innerHTML = "";
        let totalSeluruh = 0;

        karyawanList.forEach(k => {
            const saldo = k.saldo_tabungan || 0;
            totalSeluruh += saldo;

            if (saldo > 0) {
                const itemHTML = `
                    <div class="item-riwayat item-clickable" onclick='lihatRincianKaryawan(${JSON.stringify(k)})'>
                        <div class="item-left">
                            <div class="icon-jenis icon-user"><i class="fa-solid fa-user"></i></div>
                            <div class="item-info">
                                <h4>${k.nama}</h4>
                                <p>ID: ${k.id}</p>
                            </div>
                        </div>
                        <div class="item-nominal nominal-netral">
                            ${formatRupiah(saldo)}
                        </div>
                    </div>
                `;
                container.innerHTML += itemHTML;
            }
        });

        if (container.innerHTML === "") {
            container.innerHTML = `<p class="loading-text">Belum ada data tabungan karyawan.</p>`;
        }

        document.getElementById('totalSaldoAdmin').innerText = formatRupiah(totalSeluruh);
        resetBtn();
    }

    // ==========================================
    // 4. MANAJEMEN PIN KARYAWAN
    // ==========================================
    async function bukaLayarPin() {
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('pin-screen').classList.remove('hidden');
        
        const container = document.getElementById('listKaryawanPin');
        container.innerHTML = `<p class="loading-text">Memuat data akses...</p>`;

        const { data: karyawanList, error } = await db
            .from('karyawan')
            .select('id, nama, password')
            .order('nama', { ascending: true });

        if (error || !karyawanList) {
            container.innerHTML = `<p class="loading-text">Gagal memuat data akses.</p>`;
            return;
        }

        container.innerHTML = "";
        
        karyawanList.forEach(k => {
            const currentPin = k.password ? k.password : 'Belum diatur';
            const itemHTML = `
                <div class="item-riwayat">
                    <div class="item-left">
                        <div class="icon-jenis icon-key"><i class="fa-solid fa-lock"></i></div>
                        <div class="item-info">
                            <h4>${k.nama}</h4>
                            <p>ID: ${k.id} &nbsp;|&nbsp; PIN: <strong style="color:var(--text-main);">${currentPin}</strong></p>
                        </div>
                    </div>
                    <div>
                        <button class="action-btn" style="background:var(--primary); color:var(--text-main);" onclick="bukaModalPin('${k.id}', '${k.nama}', '${k.password || ''}')">Edit</button>
                    </div>
                </div>
            `;
            container.innerHTML += itemHTML;
        });
    }

    function tutupLayarPin() {
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.remove('hidden');
    }

    function bukaModalPin(id, nama, pinSekarang) {
        targetKaryawanEditId = id;
        document.getElementById('modalNamaKaryawan').innerText = `ID: ${id} - ${nama}`;
        document.getElementById('inputPinBaru').value = pinSekarang;
        document.getElementById('modalPin').classList.remove('hidden');
    }

    function tutupModalPin() {
        document.getElementById('modalPin').classList.add('hidden');
        targetKaryawanEditId = null;
        document.getElementById('inputPinBaru').value = "";
    }

    async function simpanPinBaru() {
        if (!targetKaryawanEditId) return;
        
        const inputPin = document.getElementById('inputPinBaru').value.trim();
        if (!inputPin) {
            showBottomAlert("Peringatan", "PIN tidak boleh kosong!");
            return;
        }

        const btnSimpan = document.getElementById('btnSimpanPin');
        btnSimpan.innerText = "Proses...";
        btnSimpan.disabled = true;

        const { error } = await db
            .from('karyawan')
            .update({ password: inputPin })
            .eq('id', targetKaryawanEditId);

        btnSimpan.innerText = "Simpan";
        btnSimpan.disabled = false;

        if (error) {
            showBottomAlert("Gagal", "Terjadi kesalahan saat menyimpan PIN!");
            console.error(error);
        } else {
            tutupModalPin();
            bukaLayarPin();
        }
    }

    // ==========================================
    // 5. DETAIL TABUNGAN & LOGOUT
    // ==========================================
    function lihatRincianKaryawan(userData) {
        loadDashboardView(userData, true);
    }

    function kembaliKeAdmin() {
        tampilkanLayarAdmin(dataKaryawanAktif);
    }

    async function loadDashboardView(userObj, isAdminView = false) {
        document.getElementById('login-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('dashboard-screen').classList.remove('hidden');
        
        if (isAdminView) {
            document.getElementById('btnBackAdmin').classList.remove('hidden');
            document.getElementById('btnLogout').classList.add('hidden');
            document.getElementById('labelSapaan').innerText = "Rincian Tabungan:";
        } else {
            document.getElementById('btnBackAdmin').classList.add('hidden');
            document.getElementById('btnLogout').classList.remove('hidden');
            document.getElementById('labelSapaan').innerText = "Halo,";
        }

        document.getElementById('namaKaryawan').innerText = userObj.nama;
        document.getElementById('totalSaldo').innerText = formatRupiah(userObj.saldo_tabungan);
        
        const container = document.getElementById('listRiwayat');
        container.innerHTML = `<p class="loading-text">Memuat riwayat...</p>`;

        const { data: riwayat, error } = await db
            .from('riwayat_tabungan')
            .select('*')
            .eq('id_kar', userObj.id)
            .order('tgl', { ascending: false });

        container.innerHTML = "";

        if (error || !riwayat || riwayat.length === 0) {
            container.innerHTML = `<p class="loading-text">Belum ada riwayat transaksi.</p>`;
            resetBtn();
            return;
        }

        riwayat.forEach(row => {
            const isMasuk = row.jenis === 'masuk';
            const iconClass = isMasuk ? 'icon-masuk' : 'icon-keluar';
            const iconSymbol = isMasuk ? '<i class="fa-solid fa-dollar-sign"></i>' : '<i class="fa-solid fa-money-bill-transfer"></i>';
            const nominalClass = isMasuk ? 'nominal-masuk' : 'nominal-keluar';
            const nominalPrefix = isMasuk ? '+' : '-';

            const itemHTML = `
                <div class="item-riwayat">
                    <div class="item-left">
                        <div class="icon-jenis ${iconClass}">${iconSymbol}</div>
                        <div class="item-info">
                            <h4>${row.keterangan || (isMasuk ? 'Setoran' : 'Penarikan')}</h4>
                            <p>${formatTanggal(row.tgl)}</p>
                        </div>
                    </div>
                    <div class="item-nominal ${nominalClass}">
                        ${nominalPrefix} ${formatRupiah(row.nominal).replace('Rp', '').trim()}
                    </div>
                </div>
            `;
            container.innerHTML += itemHTML;
        });
        
        resetBtn();
    }

    function prosesLogout() {
        dataKaryawanAktif = null;
        document.getElementById('inputIdKaryawan').value = "";
        document.getElementById('inputPassword').value = "";
        
        document.getElementById('dashboard-screen').classList.add('hidden');
        document.getElementById('admin-screen').classList.add('hidden');
        document.getElementById('pin-screen').classList.add('hidden');
        document.getElementById('login-screen').classList.remove('hidden');
    }
</script>

</body>
</html>
